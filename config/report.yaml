version: 1

owner_email: danielconorsims@gmail.com   # recipient; override with OWNER_EMAIL env var or `sdm email --to`
subject_template: "Sovereign Debt Monitor — {period}"      # period = YYYY-Qn

narrative:
  provider: anthropic
  model: claude-sonnet-5-5         # most recent Sonnet at build time; see docs/DECISIONS.md
  max_tokens: 64000              # thinking shares this cap with the text; streaming keeps the request alive
  effort: high            # adaptive thinking depth: low | medium | high | xhigh | max
  system_prompt_file: docs/MODEL.md
  instructions_file: prompts/report_instructions.md
  history_quarters: 8
  target_words: [1500, 2500]

schedule:
  quarterly_cron: "0 6 15 1,4,7,10 *"     # 06:00 UTC on 15 Jan/Apr/Jul/Oct
  monthly_cron:   "0 6 15 * *"            # 06:00 UTC on the 15th (quarterly run supersedes on those months)

outputs:
  quarterly_dir: reports/quarterly
  dashboard_dir: reports/dashboard
  outbox_dir: reports/outbox
  backtest_dir: reports/backtest

email:
  attachments:
    - reports/dashboard/latest.html
    - data/clean/indicators_latest.csv
  include_data_issues_section: true     # stale/broken series are always listed; never silently use old data
  stale_after_quarters: 4      # a series is listed as stale when its latest value is more than a year behind the last complete quarter

# Documented gaps: no free source exists. Listed once in the report's data-issues section with the
# reason, not repeated as failures. Remove an entry once a source is wired in.
known_gaps:
  "*.household_savings_to_debt": "household financial accounts wired for the US only (Fed Z.1)"
  "*.net_foreign_asset_position_gdp": "NIIP wired for the US only (FRED); IMF IIP not in DataMapper"
  "JP.breakeven_10y": "no free JGBi breakeven series"
  "CH.breakeven_10y": "Switzerland issues no inflation-linked bonds"
  "EA.breakeven_10y": "no free euro inflation-swap or linker breakeven series"
  "DE.breakeven_10y": "no free Bund linker breakeven series"
  "FR.breakeven_10y": "no free OATi breakeven series"
  "IT.breakeven_10y": "no free BTP Italia breakeven series"
  "NL.breakeven_10y": "the Netherlands issues no linkers"
  "*.linker_share": "linker share wired for the US and UK only"
  "GB.issuance_shortening": "UK bill share starts with the 2026 DMO snapshot; needs 8 quarters of history"
  "GB.bill_share": "UK bill share comes from the DMO gilt snapshot, first taken in 2026-Q4"
  "AU.bill_share": "AOFM data hub is behind bot protection; no other free source"
  "CA.bill_share": "no free Government of Canada bill-share series wired"
  "CH.bill_share": "no free Swiss money-market debt share series wired"
  "AU.issuance_shortening": "needs a bill share (see AU.bill_share)"
  "CA.issuance_shortening": "needs a bill share (see CA.bill_share)"
  "CH.issuance_shortening": "needs a bill share (see CH.bill_share)"
  "AU.auction_tail": "auction data wired for the US only"
  "EA.interest_to_revenue": "no euro-area aggregate revenue series before Eurostat TR is collected"
