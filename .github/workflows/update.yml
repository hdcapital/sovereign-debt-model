name: update-data

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sdm/collect/**"
      - "config/universe.yaml"
      - "data/manual/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . 2>&1 | tail -2
      - name: Update data
        run: |
          set -o pipefail
          python -m sdm.cli -v update 2>&1 | tee data/update_run.log
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "sdm-bot"
          git config user.email "sdm-bot@users.noreply.github.com"
          git add -A data
          git commit -m "data: update $(date -u +%Y-%m-%d) [skip ci]" || echo "nothing to commit"
          # replay this run's commit on top of anything pushed meanwhile; generated files from this run win
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
