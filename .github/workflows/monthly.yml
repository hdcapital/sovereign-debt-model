name: monthly

on:
  schedule:
    - cron: "0 6 15 2,3,5,6,8,9,11,12 *"   # 06:00 UTC on the 15th of non-quarterly months
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Write any alert email to reports/outbox/ instead of sending"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
      GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[report]" 2>&1 | tail -1
      - name: Monthly check
        run: |
          set -o pipefail
          python -m sdm.cli monthly ${{ inputs.dry_run && '--dry-run' || '' }} 2>&1 | tee data/monthly_run.log
      - name: Commit data and reports
        if: always()
        run: |
          git config user.name "sdm-bot"
          git config user.email "sdm-bot@users.noreply.github.com"
          git add -A data reports
          git commit -m "monthly: $(date -u +%Y-%m-%d) [skip ci]" || echo "nothing to commit"
          # replay this run's commit on top of anything pushed meanwhile; generated files from this run win
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
