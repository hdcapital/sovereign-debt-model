[project]
name = "sdm"
version = "0.1.0"
description = "Sovereign debt spiral monitor: data, indicators, backtest, quarterly report"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "pyyaml>=6",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
report = [
    "anthropic>=0.40",
    "jinja2>=3.1",
    "markdown>=3.6",
    "plotly>=5.22",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
sdm = "sdm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdm"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "N", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"src/sdm/collect/sources/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
