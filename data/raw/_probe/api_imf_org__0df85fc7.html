ange rates, External position, Financial account, Balance of payments, Capital account, Current account, External debt, International investment position, Public sector and general government, Debt service, Fiscal account" FULL_DESCRIPTION="The World Economic Outlook (WEO) database contains selected macroeconomic data series from the statistical appendix of the World Economic Outlook report, which presents the IMF staff's analysis and projections of economic developments at the global level, in major country groups and in many individual countries. The WEO is released in April and September/October each year. Use this database to find data on national accounts, gross domestic product (GDP), inflation, unemployment rates, balance of payments, fiscal indicators, trade for countries and country groups (aggregates), and commodity prices whose data are reported by the IMF. Data are available from 1980 to the present, and projections are given for the next two years. Additionally, medium-term projections are available for selected indicators. For some countries, data are incomplete or unavailable for certain years." LICENSE="© International Monetary Fund Copyright. All Rights Reserved. https://www.imf.org/external/terms.htm"><Group xsi:type="ns1:GROUP_COUNTRY__INDICATOR" INDICATOR="GGXWDG_NGDP" COUNTRY="USA" METHODOLOGY="Government Finance Statistics Manual (GFSM) 2014" HISTORICAL_DATA_SOURCE="Other" PRIMARY_DOMESTIC_CURRENCY="US dollar" LATEST_ACTUAL_ANNUAL_DATA="2025" START_END_MONTHS_OF_REPORTING_YEAR="January/December" BASIS_OF_PROJECTIONS="Fiscal projections are based on the February 2026 Congressional Budget Office baseline, adjusted for the IMF staff’s policy and macroeconomic assumptions. Projections incorporate the effects of the One Big Beautiful Bill Act (OBBBA)." METHODOLOGY_NOTES="Repatriation tax on foreign earnings (a provision of the 2017 Tax Cuts and Jobs Act), estimated at $250 billion, which accrued at end-2017 and recorded as capital transfer to the government in the GFS, was removed from government revenue. Staff's baseline projection embeds the impact of this tax provision over time to reflect the fact that corporations have eight years to pay off this tax liability. Revenue, expenditure, and net lending data are compiled using SNA 2008, and when translated into GFS this is in accordance with GFSM 2014. Due to data limitations, most series begin 2001. Historical data source: BEA and IMF's Government Finance Statistics Yearbook (revenue, expenditure, and net lending); Flow of Funds (debt). Reporting in calendar year: Yes, Original Federal Government data are in Fiscal year, all else in calendar year." FISCAL_SECTOR_VALUATION_OF_DEBT="Nominal value" FISCAL_SECTOR_GENERAL_GOVERNMENT_COMPOSITION="Central Government; State Government; Local Government" VALUATION="Accrual" FISCAL_SECTOR_INSTRUMENTS_INCLUDED_IN_GROSS_AND_NET_DEBT="Currency and Deposits; Financial Derivatives; Insurance Technical Reserves"/><Group xsi:type="ns1:GROUP_INDICATOR" INDICATOR="GGXWDG_NGDP" SERIES_NAME="Gross debt, General government, Percent of GDP" UNIT="PT" GFS_STO="G63G" SECTOR="S13" TOPIC="H00"/><Series COUNTRY="USA" INDICATOR="GGXWDG_NGDP" FREQUENCY="A" COUNTRY_UPDATE_DATE="9/30/2025" OVERLAP="OL" DECIMALS_DISPLAYED="3" SCALE="0"><Obs TIME_PERIOD="2020" OBS_VALUE="132.551502"/><Obs TIME_PERIOD="2021" OBS_VALUE="125.047912"/><Obs TIME_PERIOD="2022" OBS_VALUE="119.145464"/><Obs TIME_PERIOD="2023" OBS_VALUE="119.962799"/><Obs TIME_PERIOD="2024" OBS_VALUE="122.269666"/><Obs TIME_PERIOD="2025" OBS_VALUE="123.886351"/><Obs TIME_PERIOD="2026" OBS_VALUE="125.781289"/><Obs TIME_PERIOD="2027" OBS_VALUE="128.576431"/><Obs TIME_PERIOD="2028" OBS_VALUE="132.133735"/><Obs TIME_PERIOD="2029" OBS_VALUE="135.52706"/><Obs TIME_PERIOD="2030" OBS_VALUE="138.896782"/><Obs TIME_PERIOD="2031" OBS_VALUE="142.113273"/></Series></message:DataSet></message:StructureSpecificData>
